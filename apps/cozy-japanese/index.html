<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading...</title><style>html,body{margin:0;background:#07111a;color:#eef8ff;font-family:system-ui;min-height:100%}body{display:grid;place-items:center;min-height:100vh}</style><div id="s">Loading…</div><script>(async()=>{try{const files=["part00.txt","part01.txt","part02.txt"];let b="";for(const f of files)b+=await (await fetch(f)).text();const raw=Uint8Array.from(atob(b.trim()),c=>c.charCodeAt(0));const ds=new DecompressionStream("gzip");const html=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById("s").textContent="Load failed: "+e}})()</script>
