<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JH Project Archive · Admin</title><style>:root{color-scheme:dark;font-family:"Segoe UI Variable Text","Segoe UI","Noto Sans KR","Malgun Gothic",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#050b12;color:#edf8ff}main{width:min(1180px,94vw);margin:40px auto}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px}.bar a{color:#7ddcf2}.card{border:1px solid #1e4056;background:#081722;border-radius:14px;padding:18px;margin-top:16px}h1,h2{font-weight:700}button,input{font:inherit}.btn{border:1px solid #2e5971;background:#0b1c28;color:#e8f8ff;border-radius:9px;padding:10px 13px;cursor:pointer}.btn.primary{background:#2dc9e7;color:#04141d;border-color:#5ce7ff;font-weight:700}.btn.danger{border-color:#75404a;color:#ffc2ca;background:#1b1116}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input{border:1px solid #2a4c61;background:#050e16;color:#fff;border-radius:8px;padding:10px}.msg{padding:10px;border:1px solid #315269;background:#091824;border-radius:8px;margin-top:12px;color:#aac0cf}.table{overflow:auto}.user{display:grid;grid-template-columns:1.3fr 1.6fr .7fr .7fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #173244;font-size:13px}.user:last-child{border:0}.muted{color:#829bad;font-size:12px}.code{font-family:ui-monospace,Consolas,monospace;background:#03090e;border:1px dashed #47738b;border-radius:8px;padding:12px;word-break:break-all;color:#8df0bf}@media(max-width:800px){.grid{grid-template-columns:1fr}.user{grid-template-columns:1fr 1fr}.user .actions{grid-column:1/-1}}</style></head><body><main><div class="bar"><div><div class="muted">JH PROJECT ARCHIVE</div><h1>Admin Console</h1></div><a href="./">← Archive</a></div><div class="card" id="status">Firebase 연결 상태 확인 중…</div><section class="card" id="authCard"><h2>관리자 로그인</h2><div class="row"><input id="email" type="email" placeholder="email"><input id="pw" type="password" placeholder="password"><button class="btn primary" id="login">LOGIN</button></div><div class="msg" id="msg">Firestore의 <code>admins/&lt;내 Firebase UID&gt;</code> 문서가 있어야 관리자 권한이 활성화됩니다.</div></section><section class="card" id="tools" hidden><div class="bar"><h2>Full Access Code</h2><button class="btn" id="logout">LOGOUT</button></div><p class="muted">새 코드는 브라우저에서 생성되고 원문은 저장하지 않습니다. Firestore에는 SHA-256 해시만 저장됩니다.</p><div class="row"><input id="label" placeholder="예: FRIENDS-2026"><button class="btn primary" id="newCode">새 코드 생성</button></div><div id="codeOut"></div></section><section class="card" id="usersCard" hidden><div class="bar"><h2>회원 관리</h2><button class="btn" id="reload">새로고침</button></div><div class="table" id="users"></div></section><section class="card" id="privacyCard" hidden><h2>개인정보 문의</h2><div id="requests" class="table"></div></section></main><script type="module">import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import { firebaseConfig } from './auth/firebase-config.js';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const configured=firebaseConfig?.apiKey&&!String(firebaseConfig.apiKey).startsWith('REPLACE_');let auth,db,isAdmin=false;const hash=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');const token=()=>{const b=new Uint8Array(24);crypto.getRandomValues(b);return 'JH-'+btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};function m(t){$('#msg').textContent=t}async function adminCheck(u){if(!u)return false;const s=await getDoc(doc(db,'admins',u.uid));return s.exists()&&s.data()?.active!==false}async function loadUsers(){const box=$('#users');box.innerHTML='불러오는 중…';const snaps=await getDocs(collection(db,'users'));const rows=[...snaps.docs].sort((a,b)=>(a.data().createdAt?.seconds||0)-(b.data().createdAt?.seconds||0));box.innerHTML=rows.map(s=>{const d=s.data();return `<div class="user"><div><b>${esc(d.displayName||'-')}</b><div class="muted">${esc(d.username||s.id)}</div></div><div>${esc(d.email||'-')}</div><div>${d.fullAccess?'FULL':'MEMBER'}</div><div>${d.active===false?'SUSPENDED':'ACTIVE'}</div><div class="actions row"><button class="btn" data-full="${s.id}" data-value="${d.fullAccess?'0':'1'}">${d.fullAccess?'Full 회수':'Full 부여'}</button><button class="btn ${d.active===false?'':'danger'}" data-active="${s.id}" data-value="${d.active===false?'1':'0'}">${d.active===false?'정지 해제':'계정 정지'}</button></div></div>`}).join('')||'<div class="muted">회원 없음</div>';box.querySelectorAll('[data-full]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',b.dataset.full),{fullAccess:b.dataset.value==='1',updatedAt:serverTimestamp()});loadUsers()});box.querySelectorAll('[data-active]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'users',b.dataset.active),{active:b.dataset.value==='1',updatedAt:serverTimestamp()});loadUsers()})}async function loadRequests(){const box=$('#requests');try{const snaps=await getDocs(query(collection(db,'privacy_requests'),orderBy('createdAt','desc')));box.innerHTML=snaps.docs.map(s=>{const d=s.data();return `<div class="card" style="margin:8px 0"><b>${esc(d.email||d.uid)}</b><div class="muted">${esc(d.status||'open')}</div><p>${esc(d.message||'')}</p><button class="btn" data-close="${s.id}">처리 완료</button></div>`}).join('')||'<div class="muted">접수 없음</div>';box.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,'privacy_requests',b.dataset.close),{status:'closed',closedAt:serverTimestamp()});loadRequests()})}catch(e){box.textContent='문의 목록을 불러오지 못했습니다.'}}if(!configured){$('#status').textContent='Firebase 설정값이 아직 연결되지 않았습니다. auth/firebase-config.js를 설정하세요.';$('#authCard').hidden=true}else{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);$('#status').textContent='Firebase Spark / Firestore 연결 준비됨';$('#login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('#email').value,$('#pw').value)}catch(e){m('로그인 실패: '+e.message)}};$('#logout').onclick=()=>signOut(auth);$('#reload').onclick=()=>{loadUsers();loadRequests()};$('#newCode').onclick=async()=>{const raw=token(),h=await hash(raw),label=$('#label').value.trim()||'FRIEND';await setDoc(doc(db,'access_codes',h),{active:true,label,createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});$('#codeOut').innerHTML=`<p class="muted">아래 원문은 지금 한 번만 복사해 전달하세요.</p><div class="code">${esc(raw)}</div>`};onAuthStateChanged(auth,async u=>{isAdmin=await adminCheck(u);$('#tools').hidden=!isAdmin;$('#usersCard').hidden=!isAdmin;$('#privacyCard').hidden=!isAdmin;if(u&&!isAdmin)m('이 계정은 관리자 목록에 없습니다. Firebase UID를 admins 컬렉션에 등록하세요.');if(isAdmin){m('관리자 인증 완료');loadUsers();loadRequests()}})}</script></body></html>
