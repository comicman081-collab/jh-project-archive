name: One-shot migrate JH Project Archive

on:
  push:
    paths:
      - '.github/workflows/_one_shot_migrate_archive.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy verified site from old repository
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/comicman081-collab/2d-roundness-analyzer/main/jh-project-archive'
          mkdir -p auth thumbs
          files=(
            'index.html'
            'admin.html'
            'auth-v3.js'
            'privacy.html'
            'terms.html'
            'auth/AUTH_SETUP.md'
            'auth/firebase-config.js'
            'auth/firestore.rules'
            'thumbs/bolt-bloom.js'
            'thumbs/false-summer.js'
            'thumbs/lumenbound.js'
            'thumbs/sable-circuit.js'
            'thumbs/triad-run.js'
          )
          expected=(
            'd5cc9c737608d9a581c05f55b879a23bb604ee03'
            '7c8593b750ef505f2fd32cc117cfc0c32304a3ef'
            '9208c7aae3921fbb377107feeb1b0aa7279c37b6'
            'bb04f7c77394322c02e6e0afa783b5b8cb79684f'
            '76d6f42a9faa6fea91d6eacef1854786e6eb27f9'
            '5a5570466375d252400d1e3c89ae21d39964e906'
            '54310cfc5dedfdf1248133410f722809be722e90'
            '41d63b1c2c675af28bf990755e8cc87feb36823d'
            '246bc55dc17c294ad2c065738c3b1d92fdf868b2'
            'c4bbcc46a6e952d19ec73d94a3d662887677a23c'
            'c56a65ce329b931a6fafca4324af528c17b0a98e'
            '441b3780a369dea43479c4116af6ff2a223abc20'
            '901443c0a6d13ebe3fd2bb13dc74d730bcd92e5d'
          )
          for i in "${!files[@]}"; do
            f="${files[$i]}"
            curl --fail --silent --show-error --location "$BASE/$f" -o "$f"
            actual="$(git hash-object "$f")"
            if [ "$actual" != "${expected[$i]}" ]; then
              echo "HASH FAIL: $f expected=${expected[$i]} actual=$actual" >&2
              exit 1
            fi
            echo "PASS $f $actual"
          done
          rm -f MIGRATION_NOTE.tmp
          : > .nojekyll
          cat > README.md <<'EOF'
          # JH PROJECT ARCHIVE

          Personal project library for games, calculators, tools, and experiments.

          - Production site target: `https://comicman081-collab.github.io/jh-project-archive/`
          - Authentication: Firebase Authentication (Email/Password)
          - Member profiles/access: Cloud Firestore
          - Registration: age 14+ confirmation and privacy consent required
          - Hosting target: GitHub Pages, `main` / `/(root)`
          - Cost policy: free tiers only; no paid domain, paid hosting, or paid database

          The Firebase web configuration stored in `auth/firebase-config.js` is browser-side Firebase connection metadata. Access control is enforced with Firebase Authentication and the Firestore rules in `auth/firestore.rules`.
          EOF
      - name: Commit migrated site
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'migrate: move JH Project Archive to dedicated repository [skip actions]'
          git push origin HEAD:main
