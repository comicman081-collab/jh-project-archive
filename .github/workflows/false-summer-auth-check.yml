name: Check False Summer deploy credentials

on:
  push:
    paths:
      - '.github/workflows/false-summer-auth-check.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
      HAS_ITCH_API_KEY: ${{ secrets.ITCH_API_KEY != '' }}
      HAS_ITCHIO_API_KEY: ${{ secrets.ITCHIO_API_KEY != '' }}
      HAS_ITCH_API_TOKEN: ${{ secrets.ITCH_API_TOKEN != '' }}
      HAS_ITCH_GAME_PASSWORD: ${{ secrets.ITCH_GAME_PASSWORD != '' }}
      HAS_ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Record presence only
        shell: bash
        run: |
          mkdir -p diagnostics
          cat > diagnostics/false-summer-deploy-auth.json <<EOF
          {
            "BUTLER_API_KEY": ${HAS_BUTLER_API_KEY},
            "ITCH_API_KEY": ${HAS_ITCH_API_KEY},
            "ITCHIO_API_KEY": ${HAS_ITCHIO_API_KEY},
            "ITCH_API_TOKEN": ${HAS_ITCH_API_TOKEN},
            "ITCH_GAME_PASSWORD": ${HAS_ITCH_GAME_PASSWORD},
            "ITCH_PASSWORD": ${HAS_ITCH_PASSWORD}
          }
          EOF
      - name: Commit presence report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/false-summer-deploy-auth.json
          git commit -m 'chore: record False Summer deploy credential presence [skip actions]' || exit 0
          git push
