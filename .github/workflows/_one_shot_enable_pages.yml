name: One-shot enable GitHub Pages

on:
  push:
    paths:
      - '.github/workflows/_one_shot_enable_pages.yml'

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main root
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pages.json <<'JSON'
          {"source":{"branch":"main","path":"/"}}
          JSON
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            --data-binary @/tmp/pages.json)
          cat /tmp/response.json
          if [ "$status" != "201" ] && [ "$status" != "409" ]; then
            echo "Pages enable failed with HTTP $status" >&2
            exit 1
          fi
